name: PR-pipeline_slime-ascend

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

on:
  pr_comment:
    types: [created]
    keyword: '^(?:/)?compile*'
  pull_request_comment:
    types: [created]
    branches: ['main', 'dev', 'v0.3.2', 'v0.2.4', 'v0.2.2']
    comments: ['^(?:/)?compile*']

permissions:
  project: read
  repository: read
  pr: write
  id-token: write
  action: read

env:
  org_name: Ascend
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref || atomgit.base_ref || 'main' }}
  pr_id: ${{ atomgit.event.pull_request.number || atomgit.event.issue.number }}
  ST_IMAGE_V0_2_2: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-slime-ascend:8.5.0-a2-ubuntu22.04-py3.11-latest-v0.2.2
  ST_IMAGE_V0_2_4: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-slime-ascend:8.5.0-a2-ubuntu22.04-py3.11-latest-v0.2.4
  ST_IMAGE_DEFAULT: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-slime-ascend:8.5.0-a2-ubuntu22.04-py3.11-latest-v0.3.0

stages:
  stage1:
    name: only_doc
    select: selected_by_default
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [self-hosted, default, x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          need_build_ut: ${{ steps.set-skip.outputs.need_build_ut }}
        steps:
          - name: checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ env.TARGET_BRANCH }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ atomgit.ATOMGIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.svg'
          - name: set build skip flag
            id: set-skip
            env:
              CHANGED_FILES_JSON: ${{ steps.filter.outputs.changed_files }}
              NON_DOC: ${{ steps.filter.outputs.non-doc }}
            run: |
              set -eu
              printf 'changed: %s\n' "$CHANGED_FILES_JSON"
              printf 'non-doc: %s\n' "$NON_DOC"
              case "$NON_DOC" in
                true) echo 'need_build_ut=yes' >> "$ATOMGIT_OUTPUT" ;;
                false) echo 'need_build_ut=no' >> "$ATOMGIT_OUTPUT" ;;
                *) printf '%s\n' 'Invalid non-doc output' >&2; exit 1 ;;
              esac
              python3 - <<'PY'
              import json
              import os
              from pathlib import Path

              files = json.loads(os.environ['CHANGED_FILES_JSON'])
              if not isinstance(files, list) or not all(isinstance(p, str) for p in files):
                  raise ValueError('changed_files must be a JSON array of paths')
              if any('\n' in p or '\r' in p for p in files):
                  raise ValueError('modify_files.txt cannot represent filenames containing newlines')
              Path('modify_files.txt').write_text(
                  ''.join(p + '\n' for p in files), encoding='utf-8'
              )
              PY
              cat modify_files.txt
          - name: upload modify_files.txt
            uses: upload-artifact
            with:
              name: modify_files.txt
              path: modify_files.txt
              overwrite: true

      associate_pr_comment:
        name: associate_pr_comment
        runs-on: [self-hosted, default, x86, cpu=16]
        steps:
          - name: associate-pr-comment
            uses: associate-pr-comment
          - name: pre_pipeline
            id: pre_pipeline
            uses: cann/.gitcode/actions/pre-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
            with:
              owner: ${{ env.org_name }}
              repo: ${{ atomgit.event.repository.name }}
              pr_number: ${{ env.pr_id }}
              token: ${{ secrets.GIT_TOKEN }}
              apply_label: 'true'
              run_url: https://gitcode.com/${{ env.org_name }}/${{ atomgit.event.repository.name }}/actions/runs/${{ atomgit.workflow_run_id }}

  stage2:
    name: CodeCheck
    select: selected_by_default
    jobs:
      CodeCheck_pre_commit:
        name: CodeCheck_pre_commit
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [self-hosted, default, x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspore/mindspore_python3.11:v0.1
        steps:
          - name: checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: setup-python311
            run: |
              set -eu
              PYTHON311_BIN=$(dirname "$(command -v python3.11)")
              ln -sf "$(command -v python3.11)" "$PYTHON311_BIN/python"
              echo "$PYTHON311_BIN" >> "$ATOMGIT_PATH"
              "$PYTHON311_BIN/python" --version
          - name: install gitleaks
            run: |
              set -eu
              cd "${ATOMGIT_WORKSPACE}"
              wget --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
              cd -
          - name: pre-commit
            uses: openlibing/pre-commit-action@v1.0.0

      SCA:
        name: SCA
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [self-hosted, default, x86, cpu=16]
        steps:
          - name: checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: Run SCA PR scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: MindSpeed

      Antipoison:
        name: Antipoison
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [self-hosted, default, x86, cpu=16]
        steps:
          - name: checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: Run malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              repository-name: ${{ atomgit.repository }}
              pr-id: ${{ env.pr_id }}
              project-name: MindSpeed
              rule: Python

      ST_image_select:
        name: ST_image_select
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [self-hosted, default, x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          st_image: ${{ steps.select-image.outputs.st_image }}
          pr_id: ${{ steps.select-image.outputs.pr_id }}
          target_branch: ${{ steps.select-image.outputs.target_branch }}
        steps:
          - name: select ST image
            id: select-image
            run: |
              set -eu
              case "$TARGET_BRANCH" in
                v0.2.2) st_image="$ST_IMAGE_V0_2_2" ;;
                v0.2.4) st_image="$ST_IMAGE_V0_2_4" ;;
                *) st_image="$ST_IMAGE_DEFAULT" ;;
              esac
              test -n "$st_image"
              echo "st_image=$st_image" >> "$ATOMGIT_OUTPUT"
              echo "pr_id=${pr_id}" >> "$ATOMGIT_OUTPUT"
              echo "target_branch=${TARGET_BRANCH}" >> "$ATOMGIT_OUTPUT"

  stage3:
    name: ST
    select: selected_by_default
    jobs:
      ST:
        name: ST
        select: selected_by_default
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/st_job.yml
        with:
          pr_id: ${{ jobs.ST_image_select.outputs.pr_id }}
          target_branch: ${{ jobs.ST_image_select.outputs.target_branch }}
          st_docker_image: ${{ jobs.ST_image_select.outputs.st_image }}

post:
  jobs:
    query_pipeline:
      steps:
        - name: query_pipeline
          id: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
          with:
            owner: ${{ env.org_name }}
            repo: ${{ atomgit.event.repository.name }}
            run_id: ${{ atomgit.workflow_run_id }}
            token: ${{ secrets.GIT_TOKEN }}
            pr_number: ${{ env.pr_id }}
            apply_label: 'true'
